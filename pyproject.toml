[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppc-agent"
version = "0.1.0"
description = "Agent PPC pentru marketeri: planificare Google Ads, Meta Ads si TikTok Ads cu modele matematice si guardrails HITL"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["ppc_agent*"]

[tool.setuptools.package-data]
ppc_agent = ["py.typed"]

# ------------------------------------------------------------------------------
# Ruff — linting + sortare importuri
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Fisierele de migratie Alembic sunt generate automat (alembic revision
# --autogenerate) si rareori editate de mana — practica standard sa fie
# excluse din lint, ca fixture-urile de test.
extend-exclude = ["ppc_agent_server/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fisierul include un fixture HTML cu linii lungi inevitabile.
"ppc_agent/providers/mock/crawler.py" = ["E501"]
# Depends(...) ca valoare implicita e patternul FastAPI cerut, nu o eroare —
# B008 (flake8-bugbear) nu cunoaste conventia (desi Annotated[X, Depends(...)]
# ramane preferat, se poate strecura si direct in semnaturi).
"ppc_agent_server/**/*.py" = ["B008"]
"seo_geo_agent/**/*.py" = ["B008"]

# ------------------------------------------------------------------------------
# Mypy — verificare stricta de tip pe pachet
# ------------------------------------------------------------------------------
# python_version urmeaza interpretorul instalat: stub-urile numpy 2.5 cer 3.12+.
[tool.mypy]
python_version = "3.13"
strict = true
files = ["ppc_agent"]
# Fisierele de migratie Alembic sunt auto-generate (vezi nota din [tool.ruff]);
# exclude() se aplica si cand mypy e chemat explicit pe ppc_agent_server.
exclude = ["ppc_agent_server/migrations/versions/"]

# scikit-learn, torch si timesfm nu au stub-uri complete (timesfm e o dependinta
# OPTIONALA - vezi requirements-timesfm.txt); le ignoram punctual.
[[tool.mypy.overrides]]
module = ["sklearn.*", "torch.*", "timesfm.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
