# Verificarile backend-ului la fiecare push pe master si la fiecare pull request:
# ruff, mypy --strict, migrarile pe un Postgres real (sus, verificare, jos, iar sus) si
# cele trei suite de teste. Aceleasi versiuni ca imaginea Docker (constraints.txt).
# Site-ul (Next.js) nu e verificat aici.
name: Verificari

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Postgres de unica folosinta: migrarile si testul rolului limitat (test_app_role.py).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ppc_agent
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ppc_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppc_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ppc_agent:ci@localhost:5432/ppc_agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt

      # Ca in Dockerfile.backend: torch doar CPU (cel implicit aduce CUDA, cativa GB),
      # apoi restul la versiunile exacte pe care au trecut testele.
      - name: Dependintele Python
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "$(grep -E '^torch==' constraints.txt)"
          pip install -c constraints.txt -r requirements-dev.txt -r requirements-server.txt -r requirements-seo-geo.txt

      # CCO-ul: ffmpeg masoara video-ul, tesseract (cu romana) citeste textul de pe creative.
      - name: ffmpeg si tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-ron

      - name: ruff
        run: ruff check

      - name: mypy
        run: |
          mypy --strict ppc_agent
          mypy --strict ppc_agent_server
          mypy --strict seo_geo_agent
          mypy --strict scripts

      # Un downgrade care uita ceva (ex. un tip ENUM) strica urmatorul upgrade: se vede aici,
      # nu in ziua in care chiar trebuie dat inapoi.
      - name: Migrarile pe Postgres
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Teste ppc_agent
        run: pytest tests

      - name: Teste server
        run: pytest tests_server -rs

      - name: Teste SEO/GEO
        run: pytest tests_seo_geo
